name: V2 PY32 runtime smoke test

on:
  push:
    branches:
      - main
      - v2-k5-port
  pull_request:
    branches:
      - main
      - v2-k5-port
  workflow_dispatch:

jobs:
  compile-v2-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM embedded compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile PY32F030 system initialization
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 \
            -c driver/system_v2.c -o /tmp/system_v2.o
      - name: Compile PY32F030 SysTick timing driver
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/systick_v2.c -o /tmp/systick_v2.o
      - name: Compile PY32F030 GPIO primitives
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/gpio_v2.c -o /tmp/gpio_v2.o
      - name: Compile V2 board GPIO initialization
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/board_v2.c -o /tmp/board_v2.o
      - name: Compile V2 BK4819 bus driver
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/bk4819_bus_v2.c -o /tmp/bk4819_bus_v2.o
      - name: Compile BK4819 driver with V2 bus selected
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0 -mthumb \
            -std=c2x -Os -fno-builtin -fshort-enums \
            -DTARGET_UVK5_V2 -DENABLE_MDC1200 -DENABLE_FLEETSYNC \
            -I. -Idriver -Ibsp/py32f030 \
            -c driver/bk4819.c -o /tmp/bk4819_v2.o
      - name: Compile shared application entry, event loop, and V2 keypad
        run: |
          COMMON_FLAGS="-mcpu=cortex-m0plus -mthumb -std=gnu2x -Os -fno-builtin -fshort-enums -DTARGET_UVK5_V2 -DENABLE_MDC1200 -DENABLE_FLEETSYNC -I. -Iapp -Idriver -Iui -Ihelper -Ibsp/py32f030 -Ibsp/dp32g030 -Iexternal/CMSIS_5/CMSIS/Core/Include -Iexternal/CMSIS_5/Device/ARM/ARMCM0/Include"
          arm-none-eabi-gcc $COMMON_FLAGS -c main.c -o /tmp/main_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/app.c -o /tmp/app_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/keyboard.c -o /tmp/keyboard_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c audio.c -o /tmp/audio_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/st7565.c -o /tmp/st7565_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/backlight.c -o /tmp/backlight_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/i2c.c -o /tmp/i2c_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/eeprom.c -o /tmp/eeprom_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c radio.c -o /tmp/radio_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c functions.c -o /tmp/functions_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c settings.c -o /tmp/settings_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c helper/battery.c -o /tmp/battery_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/mdc1200.c -o /tmp/mdc1200_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/fleetsync.c -o /tmp/fleetsync_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/main.c -o /tmp/app_main_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/action.c -o /tmp/action_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/menu.c -o /tmp/menu_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/ui.c -o /tmp/ui_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/main.c -o /tmp/ui_main_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/welcome.c -o /tmp/welcome_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/scanner.c -o /tmp/scanner_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/chFrScanner.c -o /tmp/chfrscanner_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/generic.c -o /tmp/generic_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/common.c -o /tmp/common_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/battery.c -o /tmp/ui_battery_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/battery_check.c -o /tmp/ui_battery_check_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/status.c -o /tmp/ui_status_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/inputbox.c -o /tmp/ui_inputbox_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c ui/helper.c -o /tmp/ui_helper_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c scheduler.c -o /tmp/scheduler_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c misc.c -o /tmp/misc_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c dcs.c -o /tmp/dcs_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c bitmaps.c -o /tmp/bitmaps_v2.o
      - name: Assemble V2 reset and interrupt vector table
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -c start_v2.S -o /tmp/start_v2.o
      - name: Link startup, system init, SysTick driver, and linker script together
        run: |
          cat > /tmp/v2_smoke_stubs.c <<'EOF'
          #include <stdint.h>
          #include "board_v2.h"
          #include "bk4819_bus_v2.h"
          #include "systick.h"
          void DATA_Init(void) {}
          void BSS_Init(void) {}
          void Main(void)
          {
              SYSTICK_Init();
              BOARD_V2_GPIO_Init();
              BK4819_V2_BusInit();
              BK4819_V2_WriteU8(0x00U);
              BK4819_V2_WriteU16(0x0000U);
              BK4819_V2_WriteRegister(0x00U, 0x0000U);
              (void)BK4819_V2_ReadRegister(0x0CU);
              for (;;) {}
          }
          EOF
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -ffreestanding -fno-builtin \
            -Ibsp/py32f030 -Idriver \
            -c /tmp/v2_smoke_stubs.c -o /tmp/v2_smoke_stubs.o
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb -nostdlib \
            -Wl,--build-id=none -Wl,--gc-sections \
            -Wl,-Map=/tmp/v2-runtime-smoke.map \
            -T firmware_v2.ld \
            /tmp/start_v2.o /tmp/system_v2.o /tmp/systick_v2.o /tmp/gpio_v2.o /tmp/board_v2.o /tmp/bk4819_bus_v2.o /tmp/v2_smoke_stubs.o \
            -lgcc -o /tmp/v2-runtime-smoke.elf
          arm-none-eabi-size /tmp/v2-runtime-smoke.elf
          arm-none-eabi-readelf -h /tmp/v2-runtime-smoke.elf
          arm-none-eabi-nm /tmp/v2-runtime-smoke.elf | grep -E 'Reset_Handler|g_pfnVectors|SystemInit|Main|BK4819_V2_(BusInit|ReadRegister|WriteRegister)|BOARD_V2_GPIO_Init|SYSTICK_Init'

      - name: Attempt full V2 application build and link
        run: |
          make build TARGET_UVK5_V2=1 ENABLE_MDC1200=1 ENABLE_MDC1200_EDIT=1 ENABLE_MDC1200_CONTACT=1

      - name: Validate V2 image layout
        run: |
          test -s firmware
          test -s firmware.bin
          test -s archive/TrueMDC.Gen00.packed.bin
          python3 - <<'PY'
          import os
          import struct
          path = "firmware.bin"
          size = os.path.getsize(path)
          with open(path, "rb") as image:
              initial_sp, reset_vector = struct.unpack("<II", image.read(8))
          reset_address = reset_vector & ~1
          assert size <= 60 * 1024, f"image exceeds 60 KiB application flash: {size}"
          assert 0x20000000 <= initial_sp <= 0x20002000, f"invalid initial stack pointer: 0x{initial_sp:08x}"
          assert 0x08001000 <= reset_address < 0x08010000, f"reset handler outside V2 application flash: 0x{reset_vector:08x}"
          print(f"V2 image: {size} bytes; MSP=0x{initial_sp:08x}; reset=0x{reset_vector:08x}")
          PY
      - name: Publish V2 build outputs
        uses: actions/upload-artifact@v4
        with:
          name: TrueMDC-UVK5-V2-PY32F030
          if-no-files-found: error
          retention-days: 30
          path: |
            firmware
            firmware.bin
            archive/TrueMDC.Gen00.packed.bin
