name: V2 PY32 runtime smoke test

on:
  push:
    branches:
      - v2-k5-port
  pull_request:
    branches:
      - v2-k5-port
  workflow_dispatch:

jobs:
  compile-v2-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM embedded compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile PY32F030 system initialization
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 \
            -c driver/system_v2.c -o /tmp/system_v2.o
      - name: Compile PY32F030 SysTick timing driver
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/systick_v2.c -o /tmp/systick_v2.o
      - name: Compile PY32F030 GPIO primitives
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/gpio_v2.c -o /tmp/gpio_v2.o
      - name: Compile V2 board GPIO initialization
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/board_v2.c -o /tmp/board_v2.o
      - name: Compile V2 BK4819 bus driver
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -Wall -Wextra -Werror -ffreestanding \
            -Ibsp/py32f030 -Idriver \
            -c driver/bk4819_bus_v2.c -o /tmp/bk4819_bus_v2.o
      - name: Compile BK4819 driver with V2 bus selected
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0 -mthumb \
            -std=c2x -Os -fno-builtin -fshort-enums \
            -DTARGET_UVK5_V2 -DENABLE_MDC1200 -DENABLE_FLEETSYNC \
            -I. -Idriver -Ibsp/py32f030 \
            -c driver/bk4819.c -o /tmp/bk4819_v2.o
      - name: Compile shared application entry, event loop, and V2 keypad
        run: |
          COMMON_FLAGS="-mcpu=cortex-m0plus -mthumb -std=gnu2x -Os -fno-builtin -fshort-enums -DTARGET_UVK5_V2 -DENABLE_MDC1200 -DENABLE_FLEETSYNC -I. -Iapp -Idriver -Iui -Ihelper -Ibsp/py32f030 -Ibsp/dp32g030 -Iexternal/CMSIS_5/CMSIS/Core/Include"
          arm-none-eabi-gcc $COMMON_FLAGS -c main.c -o /tmp/main_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c app/app.c -o /tmp/app_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/keyboard.c -o /tmp/keyboard_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c audio.c -o /tmp/audio_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/st7565.c -o /tmp/st7565_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/backlight.c -o /tmp/backlight_v2.o
          arm-none-eabi-gcc $COMMON_FLAGS -c driver/i2c.c -o /tmp/i2c_v2.o
      - name: Assemble V2 reset and interrupt vector table
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -c start_v2.S -o /tmp/start_v2.o
      - name: Link startup, system init, SysTick driver, and linker script together
        run: |
          cat > /tmp/v2_smoke_stubs.c <<'EOF'
          #include <stdint.h>
          #include "board_v2.h"
          #include "bk4819_bus_v2.h"
          #include "systick.h"
          void DATA_Init(void) {}
          void BSS_Init(void) {}
          void Main(void)
          {
              SYSTICK_Init();
              BOARD_V2_GPIO_Init();
              BK4819_V2_BusInit();
              BK4819_V2_WriteU8(0x00U);
              BK4819_V2_WriteU16(0x0000U);
              BK4819_V2_WriteRegister(0x00U, 0x0000U);
              (void)BK4819_V2_ReadRegister(0x0CU);
              for (;;) {}
          }
          EOF
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb \
            -std=c11 -ffreestanding -fno-builtin \
            -Ibsp/py32f030 -Idriver \
            -c /tmp/v2_smoke_stubs.c -o /tmp/v2_smoke_stubs.o
          arm-none-eabi-gcc \
            -mcpu=cortex-m0plus -mthumb -nostdlib \
            -Wl,--build-id=none -Wl,--gc-sections \
            -Wl,-Map=/tmp/v2-runtime-smoke.map \
            -T firmware_v2.ld \
            /tmp/start_v2.o /tmp/system_v2.o /tmp/systick_v2.o /tmp/gpio_v2.o /tmp/board_v2.o /tmp/bk4819_bus_v2.o /tmp/v2_smoke_stubs.o \
            -lgcc -o /tmp/v2-runtime-smoke.elf
          arm-none-eabi-size /tmp/v2-runtime-smoke.elf
          arm-none-eabi-readelf -h /tmp/v2-runtime-smoke.elf
          arm-none-eabi-nm /tmp/v2-runtime-smoke.elf | grep -E 'Reset_Handler|g_pfnVectors|SystemInit|Main|BK4819_V2_(BusInit|ReadRegister|WriteRegister)|BOARD_V2_GPIO_Init|SYSTICK_Init'
